stages:
  - build
  - release

variables:
  BUN_VERSION: "1.3.13"
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/pal"

.setup_bun: &setup_bun
  - |
    if [ ! -w "${HOME}" ] || [ "${HOME}" = "/" ]; then export HOME="/tmp/ci-home"; fi
    mkdir -p "$HOME"
    export BUN_INSTALL="$HOME/.bun"
    export PATH="$BUN_INSTALL/bin:$PATH"
    mkdir -p "$BUN_INSTALL/bin"
    curl -fsSL "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip" -o /tmp/bun.zip
    python3 -c "import zipfile; zipfile.ZipFile('/tmp/bun.zip').extractall('/tmp/bun-extract')"
    mv /tmp/bun-extract/bun-linux-x64/bun "$BUN_INSTALL/bin/bun"
    chmod +x "$BUN_INSTALL/bin/bun"
    bun --version
    bun install --frozen-lockfile --ignore-scripts

.set_version: &set_version
  - export PATH="${HOME:-/tmp/ci-home}/.bun/bin:$PATH"
  - VERSION=$(bun -e "console.log(require('./packages/opencode/package.json').version)")
  - echo "PAL v${VERSION}"

.generate_snapshot: &generate_snapshot
  - export PATH="${HOME:-/tmp/ci-home}/.bun/bin:$PATH"
  - cd packages/opencode && bun run script/generate.ts && cd ../..

build-linux-x64:
  stage: build
  tags: [itup-alm-x86]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - *setup_bun
    - *set_version
    - *generate_snapshot
    - |
      export PATH="${HOME:-/tmp/ci-home}/.bun/bin:$PATH"
      bun build --compile --conditions=browser \
        --target=bun-linux-x64 \
        --define "OPENCODE_VERSION='${VERSION}'" \
        --define "OPENCODE_CHANNEL='latest'" \
        --outfile pal-linux-x64 \
        packages/opencode/src/index.ts
    - sha256sum pal-linux-x64 | awk '{print $1}' > pal-linux-x64.sha256
    - echo "${VERSION}" > version.txt
    - |
      for file in pal-linux-x64 pal-linux-x64.sha256 version.txt; do
        curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
             --upload-file "${file}" \
             "${PACKAGE_REGISTRY_URL}/${VERSION}/${file}"
      done
  artifacts:
    paths: [version.txt]

build-linux-arm64:
  stage: build
  tags: [itup-alm-x86]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - *setup_bun
    - *set_version
    - *generate_snapshot
    - |
      export PATH="${HOME:-/tmp/ci-home}/.bun/bin:$PATH"
      bun build --compile --conditions=browser \
        --target=bun-linux-arm64 \
        --define "OPENCODE_VERSION='${VERSION}'" \
        --define "OPENCODE_CHANNEL='latest'" \
        --outfile pal-linux-arm64 \
        packages/opencode/src/index.ts
    - sha256sum pal-linux-arm64 | awk '{print $1}' > pal-linux-arm64.sha256
    - |
      for file in pal-linux-arm64 pal-linux-arm64.sha256; do
        curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
             --upload-file "${file}" \
             "${PACKAGE_REGISTRY_URL}/${VERSION}/${file}"
      done

build-darwin-arm64:
  stage: build
  tags: [itup-alm-x86]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - *setup_bun
    - *set_version
    - *generate_snapshot
    - |
      export PATH="${HOME:-/tmp/ci-home}/.bun/bin:$PATH"
      bun build --compile --conditions=browser \
        --target=bun-darwin-arm64 \
        --define "OPENCODE_VERSION='${VERSION}'" \
        --define "OPENCODE_CHANNEL='latest'" \
        --outfile pal-darwin-arm64 \
        packages/opencode/src/index.ts
    - sha256sum pal-darwin-arm64 | awk '{print $1}' > pal-darwin-arm64.sha256
    - |
      for file in pal-darwin-arm64 pal-darwin-arm64.sha256; do
        curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
             --upload-file "${file}" \
             "${PACKAGE_REGISTRY_URL}/${VERSION}/${file}"
      done

release:
  stage: release
  tags: [itup-alm-x86]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - job: build-linux-x64
      artifacts: true
    - job: build-linux-arm64
    - job: build-darwin-arm64
  script:
    - VERSION=$(cat version.txt)
    - echo "Releasing PAL v${VERSION}"
    - |
      TAG_EXISTS=$(curl --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/tags/v${VERSION}" \
        | grep -c '"name"' || true)
      if [ "$TAG_EXISTS" -gt 0 ]; then
        echo "Tag v${VERSION} already exists, skipping release"
        exit 0
      fi
    - |
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --header "Content-Type: application/json" \
        --data "{
          \"name\": \"PAL v${VERSION}\",
          \"tag_name\": \"v${VERSION}\",
          \"description\": \"PAL v${VERSION} release\",
          \"assets\": {
            \"links\": [
              {\"name\": \"pal-linux-x64\",        \"url\": \"${PACKAGE_REGISTRY_URL}/${VERSION}/pal-linux-x64\",        \"filepath\": \"/pal-linux-x64\"},
              {\"name\": \"pal-linux-x64.sha256\",  \"url\": \"${PACKAGE_REGISTRY_URL}/${VERSION}/pal-linux-x64.sha256\",  \"filepath\": \"/pal-linux-x64.sha256\"},
              {\"name\": \"pal-linux-arm64\",        \"url\": \"${PACKAGE_REGISTRY_URL}/${VERSION}/pal-linux-arm64\",        \"filepath\": \"/pal-linux-arm64\"},
              {\"name\": \"pal-linux-arm64.sha256\",  \"url\": \"${PACKAGE_REGISTRY_URL}/${VERSION}/pal-linux-arm64.sha256\",  \"filepath\": \"/pal-linux-arm64.sha256\"},
              {\"name\": \"pal-darwin-arm64\",        \"url\": \"${PACKAGE_REGISTRY_URL}/${VERSION}/pal-darwin-arm64\",        \"filepath\": \"/pal-darwin-arm64\"},
              {\"name\": \"pal-darwin-arm64.sha256\",  \"url\": \"${PACKAGE_REGISTRY_URL}/${VERSION}/pal-darwin-arm64.sha256\",  \"filepath\": \"/pal-darwin-arm64.sha256\"},
              {\"name\": \"version.txt\",             \"url\": \"${PACKAGE_REGISTRY_URL}/${VERSION}/version.txt\",             \"filepath\": \"/version.txt\"}
            ]
          }
        }" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
