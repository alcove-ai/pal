stages:
  - build
  - release

variables:
  BUN_VERSION: "1.3.13"
  ENTRY_POINT: "packages/opencode/src/index.ts"
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/pal"

build:
  stage: build
  tags:
    - itup-alm-x86
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    # Install Bun (pinned version, avoid 1.3.12)
    - curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
    - export BUN_INSTALL="$HOME/.bun"
    - export PATH="$BUN_INSTALL/bin:$PATH"
    - bun --version

    # Install dependencies
    - bun install --frozen-lockfile

    # Read version from package.json
    - VERSION=$(bun -e "console.log(require('./packages/opencode/package.json').version)")
    - echo "Building PAL v${VERSION}"
    - echo "${VERSION}" > version.txt

    # Cross-compile binaries
    - |
      bun build --compile \
        --target=bun-linux-x64 \
        --define "OPENCODE_VERSION='${VERSION}'" \
        --define "OPENCODE_CHANNEL='latest'" \
        --outfile pal-linux-x64 \
        ${ENTRY_POINT}
    - |
      bun build --compile \
        --target=bun-linux-arm64 \
        --define "OPENCODE_VERSION='${VERSION}'" \
        --define "OPENCODE_CHANNEL='latest'" \
        --outfile pal-linux-arm64 \
        ${ENTRY_POINT}
    - |
      bun build --compile \
        --target=bun-darwin-arm64 \
        --define "OPENCODE_VERSION='${VERSION}'" \
        --define "OPENCODE_CHANNEL='latest'" \
        --outfile pal-darwin-arm64 \
        ${ENTRY_POINT}

    # Generate SHA-256 checksums
    - sha256sum pal-linux-x64 | awk '{print $1}' > pal-linux-x64.sha256
    - sha256sum pal-linux-arm64 | awk '{print $1}' > pal-linux-arm64.sha256
    - sha256sum pal-darwin-arm64 | awk '{print $1}' > pal-darwin-arm64.sha256

    # Upload assets to the Generic Package Registry
    - |
      for file in pal-linux-x64 pal-linux-x64.sha256 \
                   pal-linux-arm64 pal-linux-arm64.sha256 \
                   pal-darwin-arm64 pal-darwin-arm64.sha256 \
                   version.txt; do
        curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
             --upload-file "${file}" \
             "${PACKAGE_REGISTRY_URL}/${VERSION}/${file}"
      done

  artifacts:
    paths:
      - version.txt

release:
  stage: release
  tags:
    - itup-alm-x86
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - job: build
      artifacts: true
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - VERSION=$(cat version.txt)
    - echo "Releasing PAL v${VERSION}"
    # Check if tag already exists — if so, skip release
    - |
      TAG_EXISTS=$(curl --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/tags/v${VERSION}" \
        | grep -c '"name"' || true)
      if [ "$TAG_EXISTS" -gt 0 ]; then
        echo "Tag v${VERSION} already exists, skipping release"
        exit 0
      fi
    - |
      release-cli create \
        --name "PAL v${VERSION}" \
        --tag-name "v${VERSION}" \
        --description "PAL v${VERSION} release" \
        --assets-link "{\"name\":\"pal-linux-x64\",\"url\":\"${PACKAGE_REGISTRY_URL}/${VERSION}/pal-linux-x64\",\"filepath\":\"/pal-linux-x64\"}" \
        --assets-link "{\"name\":\"pal-linux-x64.sha256\",\"url\":\"${PACKAGE_REGISTRY_URL}/${VERSION}/pal-linux-x64.sha256\",\"filepath\":\"/pal-linux-x64.sha256\"}" \
        --assets-link "{\"name\":\"pal-linux-arm64\",\"url\":\"${PACKAGE_REGISTRY_URL}/${VERSION}/pal-linux-arm64\",\"filepath\":\"/pal-linux-arm64\"}" \
        --assets-link "{\"name\":\"pal-linux-arm64.sha256\",\"url\":\"${PACKAGE_REGISTRY_URL}/${VERSION}/pal-linux-arm64.sha256\",\"filepath\":\"/pal-linux-arm64.sha256\"}" \
        --assets-link "{\"name\":\"pal-darwin-arm64\",\"url\":\"${PACKAGE_REGISTRY_URL}/${VERSION}/pal-darwin-arm64\",\"filepath\":\"/pal-darwin-arm64\"}" \
        --assets-link "{\"name\":\"pal-darwin-arm64.sha256\",\"url\":\"${PACKAGE_REGISTRY_URL}/${VERSION}/pal-darwin-arm64.sha256\",\"filepath\":\"/pal-darwin-arm64.sha256\"}" \
        --assets-link "{\"name\":\"version.txt\",\"url\":\"${PACKAGE_REGISTRY_URL}/${VERSION}/version.txt\",\"filepath\":\"/version.txt\"}"
