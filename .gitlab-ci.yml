stages:
  - typecheck
  - build
  - release

variables:
  BUN_VERSION: "1.3.13"
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/pal"

.install_bun: &install_bun
  - command -v unzip >/dev/null 2>&1 || dnf install -y unzip || yum install -y unzip
  - curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
  - export BUN_INSTALL="$HOME/.bun"
  - export PATH="$BUN_INSTALL/bin:$PATH"
  - bun --version
  - bun install --frozen-lockfile

typecheck:
  stage: typecheck
  tags:
    - itup-alm-x86
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_MERGE_REQUEST_IID
  script:
    - *install_bun
    - bun turbo typecheck

build:
  stage: build
  tags:
    - itup-alm-x86
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - *install_bun

    # Read version from package.json
    - VERSION=$(bun -e "console.log(require('./packages/opencode/package.json').version)")
    - echo "Building PAL v${VERSION}"
    - echo "${VERSION}" > version.txt

    # Run the proper build (generates models-snapshot, inlines migrations,
    # applies SolidJS transforms, cross-compiles all targets)
    - cd packages/opencode
    - OPENCODE_VERSION="${VERSION}" OPENCODE_CHANNEL="latest" bun run build
    - cd ../..

    # Extract the 3 binaries PAL distributes and rename to pal-*
    - cp packages/opencode/dist/opencode-linux-x64/bin/opencode pal-linux-x64
    - cp packages/opencode/dist/opencode-linux-arm64/bin/opencode pal-linux-arm64
    - cp packages/opencode/dist/opencode-darwin-arm64/bin/opencode pal-darwin-arm64

    # Generate SHA-256 checksums
    - sha256sum pal-linux-x64 | awk '{print $1}' > pal-linux-x64.sha256
    - sha256sum pal-linux-arm64 | awk '{print $1}' > pal-linux-arm64.sha256
    - sha256sum pal-darwin-arm64 | awk '{print $1}' > pal-darwin-arm64.sha256

    # Upload assets to the Generic Package Registry
    - |
      for file in pal-linux-x64 pal-linux-x64.sha256 \
                   pal-linux-arm64 pal-linux-arm64.sha256 \
                   pal-darwin-arm64 pal-darwin-arm64.sha256 \
                   version.txt; do
        curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
             --upload-file "${file}" \
             "${PACKAGE_REGISTRY_URL}/${VERSION}/${file}"
      done

  artifacts:
    paths:
      - version.txt

release:
  stage: release
  tags:
    - itup-alm-x86
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - job: build
      artifacts: true
  script:
    - VERSION=$(cat version.txt)
    - echo "Releasing PAL v${VERSION}"
    # Check if tag already exists — if so, skip release
    - |
      TAG_EXISTS=$(curl --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/tags/v${VERSION}" \
        | grep -c '"name"' || true)
      if [ "$TAG_EXISTS" -gt 0 ]; then
        echo "Tag v${VERSION} already exists, skipping release"
        exit 0
      fi
    # Create release via API (avoids needing release-cli image)
    - |
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --header "Content-Type: application/json" \
        --data "{
          \"name\": \"PAL v${VERSION}\",
          \"tag_name\": \"v${VERSION}\",
          \"description\": \"PAL v${VERSION} release\",
          \"assets\": {
            \"links\": [
              {\"name\": \"pal-linux-x64\",       \"url\": \"${PACKAGE_REGISTRY_URL}/${VERSION}/pal-linux-x64\",       \"filepath\": \"/pal-linux-x64\"},
              {\"name\": \"pal-linux-x64.sha256\", \"url\": \"${PACKAGE_REGISTRY_URL}/${VERSION}/pal-linux-x64.sha256\", \"filepath\": \"/pal-linux-x64.sha256\"},
              {\"name\": \"pal-linux-arm64\",       \"url\": \"${PACKAGE_REGISTRY_URL}/${VERSION}/pal-linux-arm64\",       \"filepath\": \"/pal-linux-arm64\"},
              {\"name\": \"pal-linux-arm64.sha256\", \"url\": \"${PACKAGE_REGISTRY_URL}/${VERSION}/pal-linux-arm64.sha256\", \"filepath\": \"/pal-linux-arm64.sha256\"},
              {\"name\": \"pal-darwin-arm64\",       \"url\": \"${PACKAGE_REGISTRY_URL}/${VERSION}/pal-darwin-arm64\",       \"filepath\": \"/pal-darwin-arm64\"},
              {\"name\": \"pal-darwin-arm64.sha256\", \"url\": \"${PACKAGE_REGISTRY_URL}/${VERSION}/pal-darwin-arm64.sha256\", \"filepath\": \"/pal-darwin-arm64.sha256\"},
              {\"name\": \"version.txt\",            \"url\": \"${PACKAGE_REGISTRY_URL}/${VERSION}/version.txt\",            \"filepath\": \"/version.txt\"}
            ]
          }
        }" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
