name: Build & Publish

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

env:
  BUN_VERSION: "1.3.13"
  PULP_BASE: "https://packages.redhat.com"
  PULP_DOMAIN: "public-pal"
  PULP_REPO: "pal-releases"
  PULP_CONTENT_BASE: "https://packages.redhat.com/api/pulp-content/public-pal/pal"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun install --os="*" --cpu="*" --ignore-scripts @opentui/core@0.2.2

      - name: Read version
        id: version
        run: |
          VERSION=$(bun -e "console.log(require('./packages/opencode/package.json').version)")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building PAL v${VERSION}"

      - name: Generate models snapshot
        run: cd packages/opencode && bun run script/generate.ts

      - name: Build linux-x64
        run: |
          cd packages/opencode
          OPENCODE_VERSION="${{ steps.version.outputs.version }}" \
          OPENCODE_CHANNEL="latest" \
          bun run script/ci-build.ts bun-linux-x64 ../../pal-linux-x64

      - name: Build darwin-arm64
        run: |
          cd packages/opencode
          OPENCODE_VERSION="${{ steps.version.outputs.version }}" \
          OPENCODE_CHANNEL="latest" \
          bun run script/ci-build.ts bun-darwin-arm64 ../../pal-darwin-arm64

      - name: Generate checksums
        run: |
          sha256sum pal-linux-x64 | awk '{print $1}' > pal-linux-x64.sha256
          sha256sum pal-darwin-arm64 | awk '{print $1}' > pal-darwin-arm64.sha256
          echo "${{ steps.version.outputs.version }}" > version.txt

      - name: Publish to packages.redhat.com
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PULP_USERNAME: ${{ secrets.PULP_USERNAME }}
          PULP_PASSWORD: ${{ secrets.PULP_PASSWORD }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PULP_API="${PULP_BASE}/api/pulp/${PULP_DOMAIN}/api/v3"

          REPO_HREF=$(curl -s -u "${PULP_USERNAME}:${PULP_PASSWORD}" \
            "${PULP_API}/repositories/file/file/?name=${PULP_REPO}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['results'][0]['pulp_href'])")
          echo "Repository: ${REPO_HREF}"

          upload_file() {
            local file="$1" relpath="$2"
            echo "Uploading ${file} -> ${relpath}"
            TASK_HREF=$(curl -s -u "${PULP_USERNAME}:${PULP_PASSWORD}" \
              -F "file=@${file}" \
              -F "relative_path=${relpath}" \
              -F "repository=${REPO_HREF}" \
              "${PULP_API}/content/file/files/" \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('task',''))")
            if [ -n "${TASK_HREF}" ]; then
              for i in $(seq 1 30); do
                STATE=$(curl -s -u "${PULP_USERNAME}:${PULP_PASSWORD}" \
                  "${PULP_BASE}${TASK_HREF}" \
                  | python3 -c "import json,sys; print(json.load(sys.stdin).get('state',''))")
                [ "${STATE}" = "completed" ] && echo "  done" && return
                [ "${STATE}" = "failed" ] && echo "  FAILED" && exit 1
                sleep 2
              done
            fi
          }

          # Remove old latest/ content before uploading new versions
          remove_old_latest() {
            echo "Removing old latest/ content from repository..."
            OLD_HREFS=$(curl -s -u "${PULP_USERNAME}:${PULP_PASSWORD}" \
              "${PULP_API}/content/file/files/?relative_path__startswith=latest/&repository_version=${REPO_HREF}versions/&limit=50" \
              | python3 -c "import json,sys; [print(c['pulp_href']) for c in json.load(sys.stdin).get('results',[])]" 2>/dev/null || true)
            if [ -n "${OLD_HREFS}" ]; then
              HREFS_JSON=$(echo "${OLD_HREFS}" | python3 -c "import json,sys; print(json.dumps(sys.stdin.read().strip().split('\n')))")
              TASK_HREF=$(curl -s -u "${PULP_USERNAME}:${PULP_PASSWORD}" \
                -H "Content-Type: application/json" \
                -d "{\"remove_content_units\": ${HREFS_JSON}}" \
                "${PULP_BASE}${REPO_HREF}modify/" \
                | python3 -c "import json,sys; print(json.load(sys.stdin).get('task',''))")
              if [ -n "${TASK_HREF}" ]; then
                for i in $(seq 1 30); do
                  STATE=$(curl -s -u "${PULP_USERNAME}:${PULP_PASSWORD}" \
                    "${PULP_BASE}${TASK_HREF}" \
                    | python3 -c "import json,sys; print(json.load(sys.stdin).get('state',''))")
                  [ "${STATE}" = "completed" ] && echo "  old latest/ content removed" && break
                  [ "${STATE}" = "failed" ] && echo "  removal failed (non-fatal)" && break
                  sleep 2
                done
              fi
            else
              echo "  no old latest/ content found"
            fi
          }
          remove_old_latest

          upload_file pal-linux-x64           "v${VERSION}/pal-linux-x64"
          upload_file pal-linux-x64.sha256   "v${VERSION}/pal-linux-x64.sha256"
          upload_file pal-darwin-arm64        "v${VERSION}/pal-darwin-arm64"
          upload_file pal-darwin-arm64.sha256 "v${VERSION}/pal-darwin-arm64.sha256"
          upload_file version.txt             "v${VERSION}/version.txt"
          upload_file version.txt             "latest/version.txt"

      - name: Create Pulp publication
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PULP_USERNAME: ${{ secrets.PULP_USERNAME }}
          PULP_PASSWORD: ${{ secrets.PULP_PASSWORD }}
        run: |
          PULP_API="${PULP_BASE}/api/pulp/${PULP_DOMAIN}/api/v3"
          REPO_HREF=$(curl -s -u "${PULP_USERNAME}:${PULP_PASSWORD}" \
            "${PULP_API}/repositories/file/file/?name=${PULP_REPO}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['results'][0]['pulp_href'])")

          PUB_TASK=$(curl -s -u "${PULP_USERNAME}:${PULP_PASSWORD}" \
            -H "Content-Type: application/json" \
            -d "{\"repository\": \"${REPO_HREF}\"}" \
            "${PULP_API}/publications/file/file/" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('task',''))")
          for i in $(seq 1 30); do
            STATE=$(curl -s -u "${PULP_USERNAME}:${PULP_PASSWORD}" \
              "${PULP_BASE}${PUB_TASK}" \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('state',''))")
            [ "${STATE}" = "completed" ] && break
            [ "${STATE}" = "failed" ] && echo "Publication failed" && exit 1
            sleep 2
          done
          echo "Published v${{ steps.version.outputs.version }}"
